<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Depop form diagnostic</title>
  <style>
    body { font: 14px system-ui; margin: 12px; width: 420px; }
    button { padding: 8px 12px; }
    pre { background: #f4f4f4; max-height: 480px; overflow: auto; padding: 10px; white-space: pre-wrap; }
  </style>

<body>
  <h1>Depop form diagnostic</h1>
  <p>Scans labels and field types only. It never reads entered values.</p>

  <pre id="output">Open Depop’s create-listing page, then scan.</pre>
  <script src="popup.js"></script>
</body>
